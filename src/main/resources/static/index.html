```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация — Bank</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">B</div>
        <div class="logo-name">Bank</div>
    </div>

    <div class="card">

        <h1>Создать аккаунт</h1>

        <p class="subtitle">
            Заполните данные, чтобы стать клиентом банка.
            После регистрации необходимо будет подтвердить вашу личность.
        </p>

        <form action="/auth/register" method="POST">

            <div class="form-group">
                <label for="firstName">Имя</label>

                <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        placeholder="Иван"
                        autocomplete="given-name"
                        required
                >
            </div>

            <div class="form-group">
                <label for="lastName">Фамилия</label>

                <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        placeholder="Иванов"
                        autocomplete="family-name"
                        required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ivan@example.com"
                        autocomplete="email"
                        required
                >
            </div>

            <div class="form-group">
                <label for="phone">Номер телефона</label>

                <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="+372 5555 5555"
                        autocomplete="tel"
                        required
                >
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Введите пароль"
                        autocomplete="new-password"
                        minlength="8"
                        required
                >

                <span class="hint">
                    Минимум 8 символов
                </span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    Подтвердите пароль
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Повторите пароль"
                        autocomplete="new-password"
                        minlength="8"
                        required
                >
            </div>

            <div class="checkbox">
                <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                >

                <label for="terms">
                    Я принимаю
                    <a href="/terms">условия обслуживания</a>
                    и
                    <a href="/privacy">политику конфиденциальности</a>.
                </label>
            </div>

            <button type="submit">
                Создать аккаунт
            </button>

        </form>

        <div class="login-link">
            Уже есть аккаунт?
            <a href="/login">Войти</a>
        </div>

    </div>

    <div class="security-note">
        🔒 Ваши данные передаются по защищённому соединению
    </div>

</div>

<script>
    const form = document.querySelector("form");

    form.addEventListener("submit", function (event) {

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            event.preventDefault();

            alert("Пароли не совпадают.");
        }
    });
</script>

</body>
</html>
```
